  <text x="846" y="520" fill="#6D716B" font-family="Arial, sans-serif" font-size="20">Plan the analytical proof before the build</text>
  <text x="846" y="550" fill="#6D716B" font-family="Arial, sans-serif" font-size="20">so titers and intermediates answer design questions.</text>
  <rect x="846" y="584" width="214" height="40" rx="14" fill="#F1E6ED"/>
  <text x="876" y="610" fill="#7A6C74" font-family="Arial, sans-serif" font-size="18">standard + sample + control</text>
