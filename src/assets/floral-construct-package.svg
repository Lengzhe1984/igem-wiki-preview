  <rect x="252" y="432" width="88" height="52" rx="18" fill="#F1E6C9"/>
  <path d="M216 350H252" stroke="#648872" stroke-width="8" stroke-linecap="round"/>
  <path d="M216 458H252" stroke="#648872" stroke-width="8" stroke-linecap="round"/>
  <path d="M172 376V432" stroke="#648872" stroke-width="8" stroke-linecap="round"/>
  <path d="M296 376V432" stroke="#648872" stroke-width="8" stroke-linecap="round"/>
  <text x="148" y="356" fill="#7E5C6C" font-family="Arial, sans-serif" font-size="18" font-weight="700">Tryptophan</text>
