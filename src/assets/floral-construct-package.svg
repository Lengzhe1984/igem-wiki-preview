  <text x="134" y="464" fill="#5A7584" font-family="Arial, sans-serif" font-size="16" font-weight="700">N-acetyl</text>
  <text x="266" y="464" fill="#967A32" font-family="Arial, sans-serif" font-size="18" font-weight="700">Melatonin</text>
  <text x="128" y="556" fill="#6D716B" font-family="Arial, sans-serif" font-size="20">Show the route as a sequence, not a black box.</text>
  <text x="128" y="586" fill="#6D716B" font-family="Arial, sans-serif" font-size="20">Reviewers should see where the build may stall.</text>

  <rect x="444" y="228" width="312" height="426" rx="28" fill="#FFF9FB" stroke="#E6D9E2" stroke-width="2"/>
  <text x="478" y="280" fill="#26372D" font-family="Arial, sans-serif" font-size="28" font-weight="700">2. Construct package</text>
  <rect x="492" y="334" width="212" height="44" rx="16" fill="#E3F0E6"/>
  <rect x="520" y="392" width="58" height="44" rx="12" fill="#F2DDE6"/>
  <rect x="590" y="392" width="58" height="44" rx="12" fill="#D5E6F1"/>
  <rect x="660" y="392" width="58" height="44" rx="12" fill="#F1E6C9"/>
  <text x="544" y="419" fill="#7E5C6C" font-family="Arial, sans-serif" font-size="16" font-weight="700">P1</text>
  <text x="613" y="419" fill="#5A7584" font-family="Arial, sans-serif" font-size="16" font-weight="700">gene</text>
  <text x="682" y="419" fill="#967A32" font-family="Arial, sans-serif" font-size="16" font-weight="700">gene</text>
  <path d="M492 474H704" stroke="#648872" stroke-width="8" stroke-linecap="round"/>
  <circle cx="530" cy="474" r="10" fill="#9A4E70"/>
  <circle cx="598" cy="474" r="10" fill="#3D8A88"/>
  <circle cx="666" cy="474" r="10" fill="#C69743"/>
  <text x="492" y="556" fill="#6D716B" font-family="Arial, sans-serif" font-size="20">Make promoter order, enzyme order,</text>
  <text x="492" y="586" fill="#6D716B" font-family="Arial, sans-serif" font-size="20">and construct variants easy to compare.</text>

  <rect x="796" y="228" width="312" height="426" rx="28" fill="#FFF9F3" stroke="#E7D9D4" stroke-width="2"/>
  <text x="830" y="280" fill="#26372D" font-family="Arial, sans-serif" font-size="28" font-weight="700">3. Assay plan</text>
