  <text x="92" y="166" fill="#26372D" font-family="Georgia, serif" font-size="42" font-weight="700">Route map, construct logic, and assay plan should be readable together.</text>

  <rect x="92" y="228" width="312" height="426" rx="28" fill="#F6FBF8" stroke="#D7E7DE" stroke-width="2"/>
  <text x="126" y="280" fill="#26372D" font-family="Arial, sans-serif" font-size="28" font-weight="700">1. Route map</text>
  <rect x="128" y="324" width="88" height="52" rx="18" fill="#F2DDE6"/>
  <rect x="252" y="324" width="88" height="52" rx="18" fill="#D6E6D7"/>
